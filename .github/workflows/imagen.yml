name: Imagen de contenedor

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEN: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Construir y publicar en GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
