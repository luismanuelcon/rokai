name: Imagen y despliegue (Container Apps)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Construir y publicar en GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Actualizar Azure Container Apps
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Comprobar configuración
        shell: bash
        run: |
          missing=0
          for key in APP_NAME RESOURCE_GROUP AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Falta configurar $key. Consulta docs/DESPLIEGUE-CONTAINER-APPS.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Autenticar en Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar imagen del commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes
          # Mantiene la revisión anterior atendiendo mientras arranca la nueva.
          az containerapp revision set-mode --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --mode multiple
          # Fija referencias "latest" para que publicar no mueva tráfico antes de verificar salud.
          app=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" -o json)
          weights=$(printf '%s' "$app" | python3 -c 'import json,sys; p=json.load(sys.stdin)["properties"]; routes=p["configuration"]["ingress"]["traffic"]; print(" ".join((p["latestReadyRevisionName"] if r.get("latestRevision") else r["revisionName"])+"="+str(r.get("weight",0)) for r in routes))')
          test -n "$weights"
          read -r -a pinned_weights <<< "$weights"
          az containerapp ingress traffic set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --revision-weight "${pinned_weights[@]}"
          suffix="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          revision=$(az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGEN:$GITHUB_SHA" --revision-suffix "$suffix" \
            --query properties.latestRevisionName -o tsv)
          test -n "$revision"
          echo "name=$revision" >> "$GITHUB_OUTPUT"

      - name: Esperar revisión saludable
        env:
          REVISION: ${{ steps.revision.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION" --query properties.healthState -o tsv)
            if [ "$health" = "Healthy" ]; then exit 0; fi
            echo "Revisión $REVISION: $health (intento $attempt/30)"
            sleep 10
          done
          echo "::error::La revisión no está saludable. No se cambia el tráfico."
          exit 1

      - name: Enviar tráfico a la nueva revisión
        env:
          REVISION: ${{ steps.revision.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          az containerapp ingress traffic set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --revision-weight "$REVISION=100"
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "https://$fqdn/api/v1/ready"
          echo "### Desplegado: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Revisión: $REVISION" >> "$GITHUB_STEP_SUMMARY"
